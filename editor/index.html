<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Makan — Showroom editor</title><link rel="stylesheet" href="editor/editor.css"></head>
<body><div class="editor-shell">
  <aside class="sidebar"><a class="brand" href="http://localhost:3100/en" target="_blank" rel="noopener"><span class="brand-mark"><img src="public/logo.png" alt="" width="205" height="137"></span><span>MAKAN<small>LUXURY MOTORS</small></span></a><div class="workspace-label">SHOWROOM WORKSPACE</div><nav aria-label="Editor sections"><button data-section="vehicles" aria-current="page"><span>▦</span> Vehicles <small id="stock-count"></small></button><button data-section="photos"><span>▧</span> Photos</button><button data-section="showroom"><span>◈</span> Showroom content</button></nav><div class="sidebar-note"><span class="local-dot"></span> Local editor<p>Your workspace. Your catalogue.<br>Export when you’re ready.</p><a href="guide" target="_blank">Publishing guide ↗</a><form method="post" action="logout" class="logout-form"><button type="submit">Log out</button></form></div></aside>
  <div class="workspace"><header class="topbar"><span>WORKSPACE <span class="slash">/</span> <strong id="section-label">Vehicles</strong></span><span class="revision" id="revision"></span></header><main id="app" aria-busy="true"><p class="loading">Opening your showroom…</p></main></div>
  <footer class="savebar"><div><span id="draft-dot" class="draft-dot"></span><span id="draft-status" role="status" aria-live="polite">Loading catalogue</span><span id="validation-summary"></span></div><div class="save-actions"><button id="import-button" class="button secondary">Import catalogue</button><button id="save-button" class="button secondary">Save draft</button><button id="export-button" class="button secondary">Export updates ↗</button><button id="publish-button" class="button gold">Save to site ✓</button></div></footer>
</div><input id="import-file" type="file" accept=".json,.zip" hidden><div id="toast" role="status" aria-live="polite"></div><script type="module" src="editor/editor.mjs"></script></body></html>
