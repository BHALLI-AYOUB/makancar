<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Makan — Espace admin</title><link rel="stylesheet" href="editor/login.css"></head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand"><img src="public/logo.png" alt="" width="120" height="80"><span>MAKAN<small>LUXURY MOTORS</small></span></div>
      <p class="login-eyebrow">ESPACE ADMIN</p>
      <h1>Connexion</h1>
      <p class="login-lead">Connectez-vous pour accéder à l’éditeur du showroom.</p>
      <!--ERROR-->
      <form method="post" action="login" class="login-form">
        <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Se connecter</button>
      </form>
    </div>
  </main>
</body></html>
